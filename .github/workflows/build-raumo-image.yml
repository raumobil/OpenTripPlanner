name: "build image"
on:
  push:
    branches:
      - "raumo-dev"
  workflow_dispatch:

# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    environment: ${{ github.ref_name }}
    runs-on: selfhosted-linux
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: build image
        run: docker build -t ${{ secrets.RAUMO_REGISTRY }}/${{ vars.RAUMO_PROJECT }}_${{ github.ref_name }}:latest .
      - name: push image
        run: docker push ${{ secrets.RAUMO_REGISTRY }}/${{ vars.RAUMO_PROJECT }}_${{ github.ref_name }}:latest

